<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>BremLogic</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #000;
        color: #f4f7fb;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: #000;
      }

      main {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: end center;
        padding: 0 1.4rem calc(env(safe-area-inset-bottom, 0px) + 2rem);
        background:
          radial-gradient(circle at 50% 14%, rgba(101, 217, 255, 0.12), transparent 42%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.24));
      }

      .card {
        width: min(30rem, calc(100vw - 2rem));
        padding: 1rem 1.1rem;
        border: 1px solid rgba(116, 149, 186, 0.24);
        border-radius: 1.1rem;
        background: rgba(7, 11, 18, 0.72);
        backdrop-filter: blur(16px);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.1rem;
      }

      p {
        margin: 0;
        line-height: 1.45;
        font-size: 0.92rem;
        color: rgba(234, 242, 249, 0.82);
      }
    </style>
  </head>
  <body>
    <main>
      <video autoplay muted loop playsinline preload="auto">
        <source src="./assets/splashscreen.mp4" type="video/mp4" />
      </video>
      <div class="overlay">
        <div class="card">
          <h1>BremLogic is loading</h1>
          <p>
            This iOS shell points to the live Signals Bot dashboard at
            <strong>app.bremlogic.com</strong>. The splash screen will stay up while the app connects.
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
